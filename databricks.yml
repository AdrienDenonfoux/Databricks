# This is a Declarative Automation Bundle definition for motocyclestore.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: motocyclestore
  uuid: d5c36a75-609c-48b1-b2e5-15b11f39d024

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The name of the data catalog.
    default: demoworkspace
  schema:
    description: The name of the schema (database)
    default: motocycle_bundle


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405618176164444.4.azuredatabricks.net
    # variables:
      # catalog: demoworkspace
      # schema: motocycle_bundle
      # schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405618176164444.4.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/adriendenonfoux1@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/adriendenonfoux1@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: demoworkspace
      schema: prod
    permissions:
      - user_name: adriendenonfoux1@gmail.com
        level: CAN_MANAGE

